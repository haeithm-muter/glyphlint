# Typecheck, test and build on every push and pull request.
#
# The browser install is a separate step because `npm install` deliberately skips the download, and
# roughly half the test suite drives a real page. `--with-deps` is what makes Chromium runnable on
# a bare Ubuntu runner.
#
# Note what this workflow does not do: it never scans anybody else's website. See deploy.yml and
# decision 024.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install fonts for the writing systems under test
        # Playwright's own dependency set covers Latin, CJK and emoji, and nothing else this
        # project is about: a bare runner has no font for Arabic, Hebrew, Thai or Devanagari.
        # Chromium then draws that text with a last-resort fallback, which changes its metrics and
        # makes the font probe report every multi-script page — including our own report — as
        # having a font stack that is not rendering. That finding is correct on such a machine, and
        # the fix is to give the machine the fonts rather than to quieten the rule: you cannot audit
        # multi-script typography on a system that cannot draw the scripts.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-cjk
          fc-cache -f
          fc-list :lang=ar family | head -5
          fc-list :lang=hi family | head -5
          fc-list :lang=th family | head -5

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the README numbers still match the committed results
        # The metrics protocol as a gate: `npm run metrics` rewrites the block from the results
        # file, so a clean tree afterwards means every published number is reproducible. A dirty
        # tree means the README drifted from the evidence, and the evidence wins.
        run: |
          npm run metrics
          git diff --exit-code README.md
